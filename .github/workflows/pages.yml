name: Publish project site (manual)

# Preparing this workflow does not enable Pages or publish on push/merge.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the bundled project example publicly to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Validate, test and build the entire React site
        run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Record the artifact identity
        run: |
          printf 'Source commit: `%s`\n\n' "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/index.html >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy the complete project site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
