name: Full site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Use the pinned npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Validate, test and build the entire React site
        run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Record the artifact identity
        run: |
          printf 'Source commit: `%s`\n\n' "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/index.html >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-diagramming-${{ github.sha }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
