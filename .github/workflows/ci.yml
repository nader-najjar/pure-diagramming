name: Full site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: 1.28.1
      - name: Validate, test and build the entire React site
        run: |
          bazel build //... --define=SOURCE_COMMIT="$SOURCE_COMMIT"
          bazel test //... --define=SOURCE_COMMIT="$SOURCE_COMMIT"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Record the artifact identity
        run: |
          printf 'Source commit: `%s`\n\n' "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          sha256sum bazel-bin/dist/index.html >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-schematic-${{ github.sha }}
          path: bazel-bin/dist/index.html
          if-no-files-found: error
          retention-days: 14
